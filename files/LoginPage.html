<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS Linking -->
    <link rel="stylesheet" href="Login.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <title>Caravan Admin Management · Sign In</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md fixed-top">
      <div class="container-fluid">
        <!-- Logo -->
        <div class="nav-left">
          <a class="navbar-brand" href="/login" aria-label="Caravan Admin Management sign in">
            <img
              src="./Images/CaravanLogo_Transparent.png"
              alt="Caravan Admin Management"
              height="60"
              id="Caravan_Logo"
            />
          </a>
        </div>

        <div class="admin-navbar-title">Caravan Admin Management</div>
      </div>
    </nav>

    <!-- Login Form -->
    <div class="formContainer container-fluid">
      <div class="form-card">
        <h1 class="form-title">SIGN IN</h1>
        <p class="form-subtitle">Please confirm your details</p>

        <!-- Error Message -->
        <div
          id="error-message"
          class="error-message"
          style="display: none"
        ></div>

        <!-- Success Message -->
        <div
          id="success-message"
          class="success-message"
          style="display: none"
        ></div>

        <form class="register-form" id="loginForm">
          <input
            type="text"
            id="email"
            placeholder="Email Address"
            class="form-input"
            name="email"
            autocomplete="email"
          />

          <div class="password-container">
            <input
              type="password"
              id="password"
              placeholder="Password"
              class="form-input"
              name="password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <button type="submit" class="register-btn" id="loginButton">
            Sign In
          </button>
        </form>

      </div>
    </div>

    <div class="overlay"></div>

    <!-- JavaScript Linking -->
    <script src="Login.js"></script>
  </body>
</html>
