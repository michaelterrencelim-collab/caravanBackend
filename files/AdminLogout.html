<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Caravan Admin Sign Out</title>
  <style>
    :root { color-scheme: dark; --bg:#14100c; --panel:#1c1712; --border:#34291d; --gold:#d9a441; --text:#f2ede4; --muted:#a99e91; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(460px,100%); padding:32px; border:1px solid var(--border); border-radius:16px; background:var(--panel); text-align:center; }
    h1 { margin:0 0 10px; font-size:1.5rem; }
    p { color:var(--muted); }
    a { display:inline-block; margin-top:12px; padding:10px 18px; border-radius:8px; background:var(--gold); color:#1c1712; font-weight:700; text-decoration:none; }
  </style>
  <script src="/AdminLogout.js" defer></script>
</head>
<body>
  <main>
    <h1>Signing out</h1>
    <p id="logoutMessage" role="status" aria-live="polite">Clearing this browser's admin session…</p>
    <a id="loginLink" href="/login" hidden>Go to admin login</a>
  </main>
</body>
</html>
