<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caravan · Settings and Configuration</title>
<link rel="stylesheet" href="AdminCSS.css">
<link rel="stylesheet" href="SettingsCSS.css">
</head>
<body>

<div class="CaravanDesk">
  <aside class="SideNav">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <img src="./Images/Caravan-Icon.png" alt="Caravan logo">
      </span>
      <span class="CompName">Caravan</span>
    </div>

    <nav class="navigation" aria-label="Primary">
      <ul>
        <li>
          <a href="/admin/dashboard" class="nav-link" data-page="Dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="/admin/productsReports" class="nav-link" data-page="Products &amp; Reports">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v5.2L5.6 16A2 2 0 0 0 7.4 19h9.2a2 2 0 0 0 1.8-3l-4.4-7.8V3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 14.5h9" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Products &amp; Reports</span>
          </a>
        </li>
        <li>
          <a href="/admin/ordersReports" class="nav-link" data-page="Orders Reports">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 11h6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Orders Reports</span>
          </a>
        </li>
        <li>
          <a href="/admin/stocksInventory" class="nav-link" data-page="Stocks Inventory">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
            <span>Stocks Inventory</span>
          </a>
        </li>
        <li>
          <a href="/admin/accountManagement" class="nav-link" data-page="Manage Accounts">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Manage Accounts</span>
          </a>
        </li>
        <li>
          <a href="/admin/salesReport" class="nav-link" data-page="Sales Report">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-5 4 3 8-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Sales Report</span>
          </a>
        </li>
        <li>
          <a href="/admin/contentManagement" class="nav-link" data-page="Content Management">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 4v5" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Content Management</span>
          </a>
        </li>
        <li>
          <a href="/admin/audit" class="nav-link" data-page="Audit Trail">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 11h4M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Audit Trail</span>
          </a>
        </li>
        <li>
          <a href="/admin/settings" class="nav-link is-active" data-page="Settings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2.3M12 18.7V21M21 12h-2.3M5.3 12H3M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Settings</span>
          </a>
        </li>
      </ul>

      <button class="signout" id="signOutBtn" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="9" height="18" rx="1.4" stroke="currentColor" stroke-width="1.6"/><path d="M11 12h9m0 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Sign Out</span>
    </button>
    </nav>
  </aside>

  <main class="content">
    <div class="panel">

      <header class="panel-header">
        <div>
          <h1 id="pageTitle">Settings and Configuration</h1>
        </div>
      </header>

      <p class="st-message" id="settingsMessage" role="status" aria-live="polite"></p>

      <section class="section st-section">
        <div class="st-section-head">
          <h2 class="section-title st-title">Shipping Options</h2>
          <button type="button" class="st-add-option" data-action="add-shipping">Add Option +</button>
        </div>
        <div class="products-card st-card st-option-list" id="shippingOptions" aria-live="polite"></div>
      </section>

      <section class="section st-section">
        <div class="st-section-head">
          <h2 class="section-title st-title">Vouchers</h2>
          <button type="button" class="st-add-option" data-action="add-voucher">Add Option +</button>
        </div>
        <div class="products-card st-card st-option-list" id="voucherOptions" aria-live="polite"></div>
      </section>

      <dialog class="st-dialog" id="optionEditor" aria-labelledby="optionEditorTitle">
        <form class="st-dialog__content" id="optionForm">
          <header class="st-dialog__header">
            <div>
              <p class="st-dialog__eyebrow">Settings</p>
              <h2 id="optionEditorTitle">Add option</h2>
            </div>
            <button type="button" class="st-dialog__close" data-close-editor aria-label="Close">&times;</button>
          </header>
          <div class="st-dialog__fields" id="optionFields"></div>
          <p class="st-dialog__error" id="optionFormError" role="alert"></p>
          <footer class="st-dialog__actions">
            <button type="button" class="st-button st-button--secondary" data-close-editor>Cancel</button>
            <button type="submit" class="st-button st-button--primary" id="optionFormSubmit">Continue</button>
          </footer>
        </form>
      </dialog>

      <dialog class="st-dialog st-confirm-dialog" id="optionConfirmation" aria-labelledby="optionConfirmationTitle">
        <div class="st-dialog__content">
          <header class="st-dialog__header">
            <div>
              <p class="st-dialog__eyebrow">Confirm addition</p>
              <h2 id="optionConfirmationTitle">Add this option?</h2>
            </div>
            <button type="button" class="st-dialog__close" data-close-confirm aria-label="Close">&times;</button>
          </header>
          <p class="st-confirm-copy" id="optionConfirmationCopy"></p>
          <p class="st-dialog__error" id="optionConfirmationError" role="alert"></p>
          <footer class="st-dialog__actions">
            <button type="button" class="st-button st-button--secondary" data-close-confirm>Cancel</button>
            <button type="button" class="st-button st-button--primary" id="confirmAddOption">Confirm</button>
          </footer>
        </div>
      </dialog>

    </div>
  </main>

</div>

<script src="ADDashboard.js"></script>
<script src="SettingsConfigJS.js"></script>
</body>
</html>
